# Builds the homebrew app and the live module with devkitPro, so no local toolchain is needed.
# - every push / manual run: downloadable "TrophyNX" artifact (zip with the SD card layout)
# - push to main with a new version (include/version.h): GitHub release vX.Y.Z (what the in-app updater installs)
# - push to main: test build on the "builds" branch (updater channel "builds")
name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Changelog entry
        # warning on branches; on main a new version without its CHANGELOG.md section fails the release
        run: |
          if ! command -v python3 >/dev/null; then apt-get update -qq && apt-get install -y -qq python3 >/dev/null; fi
          v=$(sed -n 's/^#define APP_VERSION "\(.*\)"/\1/p' include/version.h)
          python3 tools/release/changelog.py check "$v" || echo "::warning::CHANGELOG.md has no section for $v yet"
      - name: Host tests (BYML reader)
        run: |
          apt-get update -qq && apt-get install -y -qq g++ zip >/dev/null
          g++ -std=gnu++17 -Iinclude host/test/test_byml.cpp source/byml.cpp -o /tmp/test_byml
          /tmp/test_byml   # no save fixtures in CI: checks that it builds and survives junk input
          g++ -std=gnu++17 -Iinclude host/test/test_json.cpp source/json_doc.cpp source/byml.cpp -x c source/cJSON.c -o /tmp/test_json
          /tmp/test_json
          g++ -std=gnu++17 -fno-exceptions -Iinclude host/test/test_formats.cpp source/save_formats.cpp source/json_doc.cpp source/byml.cpp -x c source/cJSON.c -o /tmp/test_formats
          /tmp/test_formats
          g++ -std=gnu++17 -fno-exceptions -Iinclude host/test/test_sgb.cpp source/save_formats.cpp source/json_doc.cpp source/byml.cpp -x c source/cJSON.c -o /tmp/test_sgb
          /tmp/test_sgb
          g++ -std=gnu++17 -fno-exceptions -Iinclude host/test/test_deltarune.cpp source/save_formats.cpp source/json_doc.cpp source/byml.cpp -x c source/cJSON.c -o /tmp/test_deltarune
          apt-get install -y -qq python3 >/dev/null
          python3 tools/deltarune/make_test_save.py /tmp/drsave
          /tmp/test_deltarune /tmp/drsave
          # THEATRHYTHM reader (AES + raw DEFLATE + MessagePack) on synthetic saves (dummy password), with sanitizers
          g++ -std=gnu++17 -fno-exceptions -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -Iinclude host/test/test_theatrhythm.cpp source/rules.cpp source/memrules.cpp source/fileutil.cpp source/save_formats.cpp source/json_doc.cpp source/byml.cpp -x c source/cJSON.c -o /tmp/test_theatrhythm
          # ASan + the runners' high-entropy ASLR loops on "DEADLYSIGNAL": run without ASLR, or UBSan only if that is refused
          if ! timeout 300 setarch "$(uname -m)" -R /tmp/test_theatrhythm; then
            echo "ASan run failed or ASLR could not be disabled: retrying with UBSan only"
            g++ -std=gnu++17 -fno-exceptions -g -fsanitize=undefined -fno-sanitize-recover=undefined -Iinclude host/test/test_theatrhythm.cpp source/rules.cpp source/memrules.cpp source/fileutil.cpp source/save_formats.cpp source/json_doc.cpp source/byml.cpp -x c source/cJSON.c -o /tmp/test_theatrhythm_ub
            timeout 300 /tmp/test_theatrhythm_ub
          fi
      - name: Host test (memory rules)
        run: |
          g++ -std=gnu++17 -fno-exceptions -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -Iinclude host/test/test_memrules.cpp source/memrules.cpp source/rules.cpp source/fileutil.cpp source/save_formats.cpp source/json_doc.cpp source/byml.cpp -x c source/cJSON.c -o /tmp/test_memrules
          if ! timeout 300 setarch "$(uname -m)" -R /tmp/test_memrules; then
            echo "ASan run failed or ASLR could not be disabled: retrying with UBSan only"
            g++ -std=gnu++17 -fno-exceptions -g -fsanitize=undefined -fno-sanitize-recover=undefined -Iinclude host/test/test_memrules.cpp source/memrules.cpp source/rules.cpp source/fileutil.cpp source/save_formats.cpp source/json_doc.cpp source/byml.cpp -x c source/cJSON.c -o /tmp/test_memrules_ub
            timeout 300 /tmp/test_memrules_ub
          fi
      - name: Host test (scan on close = same values as the app)
        run: |
          apt-get install -y -qq python3 >/dev/null
          g++ -std=gnu++17 -fno-exceptions -Iinclude host/test/test_stream.cpp source/rules.cpp source/memrules.cpp source/fileutil.cpp source/save_formats.cpp source/json_doc.cpp source/byml.cpp -x c source/cJSON.c -o /tmp/test_stream
          python3 host/test/gen_saves.py /tmp/streamroot romfs/games
          /tmp/test_stream romfs/games /tmp/streamroot/saves
      - name: Host test (live save = save image read from raw NAND while the game runs)
        run: |
          apt-get install -y -qq python3 >/dev/null
          g++ -std=gnu++17 -fno-exceptions -g -fsanitize=address,undefined -fno-sanitize-recover=undefined -Iinclude host/test/test_saveimage.cpp source/saveimage.cpp source/rawfat.cpp source/sha256.cpp source/rules.cpp source/memrules.cpp source/fileutil.cpp source/save_formats.cpp source/json_doc.cpp source/byml.cpp -x c source/cJSON.c -o /tmp/test_saveimage
          python3 host/test/make_save_image.py /tmp/img1
          python3 host/test/make_save_image.py /tmp/img2 --header-b --v4 --seed 7
          python3 host/test/make_save_image.py /tmp/img3 --seed 3
          # same ASan/ASLR "DEADLYSIGNAL" loop as above: no ASLR, or UBSan only
          if ! timeout 300 setarch "$(uname -m)" -R /tmp/test_saveimage /tmp/img1 /tmp/img2 /tmp/img3; then
            echo "ASan run failed or ASLR could not be disabled: retrying with UBSan only"
            g++ -std=gnu++17 -fno-exceptions -g -fsanitize=undefined -fno-sanitize-recover=undefined -Iinclude host/test/test_saveimage.cpp source/saveimage.cpp source/rawfat.cpp source/sha256.cpp source/rules.cpp source/memrules.cpp source/fileutil.cpp source/save_formats.cpp source/json_doc.cpp source/byml.cpp -x c source/cJSON.c -o /tmp/test_saveimage_ub
            timeout 300 /tmp/test_saveimage_ub /tmp/img1 /tmp/img2 /tmp/img3
          fi
      - name: Host test (save captures + Wi-Fi share server)
        run: |
          apt-get install -y -qq curl >/dev/null || true
          g++ -std=gnu++17 -fno-exceptions -Iinclude host/test/test_captures.cpp source/captures.cpp source/share_server.cpp source/fileutil.cpp -x c source/cJSON.c -o /tmp/test_captures -lpthread
          /tmp/test_captures
      - name: Host test (play history)
        run: |
          g++ -std=gnu++17 -Iinclude host/test/test_history.cpp source/history.cpp -o /tmp/test_history
          /tmp/test_history
      - name: Host test (updater SHA-256)
        run: |
          g++ -std=gnu++17 -Iinclude host/test/test_sha256.cpp source/sha256.cpp -o /tmp/test_sha256
          /tmp/test_sha256
      - name: Host test (popup renderer)
        run: |
          apt-get install -y -qq fonts-dejavu-core >/dev/null || true
          g++ -std=gnu++17 -Isysmodule/include -Iinclude sysmodule/test/test_popup.cpp sysmodule/source/popup_draw.cpp -o /tmp/test_popup
          /tmp/test_popup /tmp
      - name: libcurl (in-app updater)
        # before libnx from source: the package may pull the packaged libnx, which the next step replaces
        # already in the devkitPro image; pkg.devkitpro.org sometimes answers 403 to CI, so only install if missing
        run: |
          if [ -f "$DEVKITPRO/portlibs/switch/lib/libcurl.a" ]; then echo "libcurl already installed"; else dkp-pacman -Sy --noconfirm --needed switch-curl switch-zlib; fi
      - name: libnx from source
        # the app needs NacpStruct.lang_data / titles_data_format (firmware 21+ compressed titles),
        # newer than the libnx package shipped in the devkitPro image
        run: |
          git clone --depth 1 https://github.com/switchbrew/libnx /tmp/libnx
          make -C /tmp/libnx -j"$(nproc)" install
      - name: Build app
        run: make -j"$(nproc)"
      - name: Build live module
        run: |
          # the Makefile lists data/ files before its rule creates them: prepare it first
          sh sysmodule/make_data.sh
          make -C sysmodule -j"$(nproc)"
      - name: Package SD card layout
        run: |
          mkdir -p sd/switch sd/atmosphere/contents/420000000000AC01/flags
          cp TrophyNX.nro sd/switch/
          cp sysmodule/sys-trophynx.nsp sd/atmosphere/contents/420000000000AC01/exefs.nsp
          cp sysmodule/toolbox.json sd/atmosphere/contents/420000000000AC01/
          touch sd/atmosphere/contents/420000000000AC01/flags/boot2.flag
          (cd sd && zip -qr ../TrophyNX-sd.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: TrophyNX
          path: sd/
      - name: New version?
        id: ver
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v=$(sed -n 's/^#define APP_VERSION "\(.*\)"/\1/p' include/version.h)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then
            echo "v$v already released: test build only"; echo "new=false" >> "$GITHUB_OUTPUT"
          else
            # every release needs its CHANGELOG.md section (release notes + the app's update screen)
            python3 tools/release/changelog.py check "$v"
            echo "new=true" >> "$GITHUB_OUTPUT"
            # assets: each SD file under its own name + version.json (in-app updater), the .nro and the SD zip
            python3 tools/release/make_version.py sd /tmp/version.json "$GITHUB_SHA" @changelog /tmp/rel
            cp TrophyNX-sd.zip /tmp/rel/
            # previous release's version.json: lists which files this update really replaces
            python3 -c "import urllib.request,sys; open('/tmp/prev.json','wb').write(urllib.request.urlopen(sys.argv[1], timeout=30).read())" \
              "https://github.com/${{ github.repository }}/releases/latest/download/version.json" || rm -f /tmp/prev.json
            module=$(sed -n 's/^#define MODULE_VERSION "\(.*\)"/\1/p' sysmodule/source/main.cpp)
            { printf 'App %s · live module %s\n\n' "$v" "$module"; python3 tools/release/changelog.py notes "$v" /tmp/version.json /tmp/prev.json; } > /tmp/notes.md
            cat /tmp/notes.md
          fi
      - name: Release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: TrophyNX ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: /tmp/notes.md
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: /tmp/rel/*
      - name: Publish to the "builds" branch
        # direct downloads from a phone: https://github.com/<owner>/<repo>/tree/builds
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rm -rf /tmp/pub && mkdir /tmp/pub && cp TrophyNX.nro TrophyNX-sd.zip /tmp/pub/
          # in-app updater (ZL): version.json + the SD layout, file by file (source/update.cpp)
          cp -r sd /tmp/pub/sd
          python3 tools/release/make_version.py sd /tmp/pub/version.json "$GITHUB_SHA" "$(git log -1 --format=%s)"
          printf 'Built from %s on %s\n\n- TrophyNX.nro -> sdmc:/switch/\n- TrophyNX-sd.zip -> unzip at the root of the SD card (app + live module)\n- version.json + sd/: used by the in-app updater (ZL)\n' "$GITHUB_SHA" "$(date -u +%F)" > /tmp/pub/README.md
          cd /tmp/pub && git init -q -b builds && git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "Build ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" builds
